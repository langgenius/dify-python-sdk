name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # The live harness needs a Dify to talk to, so it is opt-in rather than
  # on every push.
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv sync --dev --extra workflow

    - name: Run ruff (linting)
      run: |
        uv run ruff check dify_client tests

    - name: Run black (check formatting)
      run: |
        uv run black --check dify_client tests

    - name: Run isort (check import sorting)
      run: |
        uv run isort --check-only dify_client tests

    - name: Run mypy (type checking)
      run: |
        uv run mypy dify_client

    - name: Compile Python files (syntax check)
      run: |
        uv run python -m py_compile $(find dify_client -name "*.py") $(find tests -name "*.py")

  test:
    name: Test Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv sync --dev --extra workflow

    # The Service-API coverage tests read Dify's own controllers. Without this
    # they skip, and a skipped check proves nothing.
    - name: Install bubblewrap
      # The code-node tests need an OS sandbox. This installs one; whether it
      # can be used is a second question, and the tests ask it by trying:
      # GitHub's runners refuse the network namespace bubblewrap sets up
      # ("RTM_NEWADDR: Operation not permitted"), so today these tests skip
      # here and run on a developer's machine. Installed anyway, so that they
      # start running the day that changes.
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

    - name: Check out the Dify this SDK is verified against
      run: |
        git clone --depth 1 --branch "$(cat tests/DIFY_VERSION)" \
          https://github.com/langgenius/dify.git ../dify-oss

    - name: Run tests with pytest
      run: |
        uv run pytest -v -m "not live" --cov=dify_client --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv sync --dev --extra workflow

    - name: Run bandit security linter
      run: |
        uv run bandit -r dify_client -f json -o bandit-report.json

  
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json

  live:
    # Contract tests against a real Dify. Opt-in: it needs a server, so it runs
    # on a schedule and on demand rather than on every push.
    name: Live contract tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --dev --extra workflow

    - name: Run the harness
      env:
        DIFY_HOST: ${{ secrets.DIFY_HOST }}
        DIFY_CONSOLE_EMAIL: ${{ secrets.DIFY_CONSOLE_EMAIL }}
        DIFY_CONSOLE_PASSWORD: ${{ secrets.DIFY_CONSOLE_PASSWORD }}
      run: |
        uv run pytest tests/live -v
