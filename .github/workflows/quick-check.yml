name: Quick Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quick-check:
    name: Quick Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      # With the `workflow` extra: this job collects the whole suite, and
      # `tests/test_workflow.py` imports `dify_client.workflow`, which needs
      # graphon. Without it the run fails at collection rather than at a test.
      run: |
        uv sync --dev --extra workflow

    - name: Install bubblewrap
      # The code-node tests confine what they run. GitHub's runners do not
      # allow the network namespace bubblewrap needs, so they skip here — see
      # the same step in ci.yml.
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

    - name: Quick syntax check
      run: |
        find dify_client tests -name "*.py" -exec uv run python -m py_compile {} \;

    - name: Check import sorting
      run: |
        uv run isort --check-only dify_client tests

    - name: Run quick tests
      run: |
        uv run pytest tests/ -x --tb=short -m "not live"

    - name: Every exported name resolves
      # This used to import specific classes by hand, and went on naming ones
      # that had been deleted. Checking __all__ cannot go stale that way.
      run: |
        uv run python -c "
        import dify_client
        missing = [n for n in dify_client.__all__ if not hasattr(dify_client, n)]
        assert not missing, missing
        print(f'{len(dify_client.__all__)} exported names, all resolvable')
        "