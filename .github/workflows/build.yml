name: Build and Publish

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install build dependencies
      run: |
        uv sync --dev --extra workflow

    - name: Run the tests that do not need a server
      # A release tag does not run ci.yml, so without this the package could
      # be published without anything having been run against it.
      run: |
        uv run pytest -q -m "not live"

    - name: Build package
      # `uv build`, not `uv run build`: the `build` package installs a script
      # called `pyproject-build`, so `uv run build` fails to spawn — which it
      # did, on every release.
      run: |
        uv build

    - name: Check package
      run: |
        uv run twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  test-install:
    name: Test Package Installation
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install dist/*.whl

    - name: Test import, with no optional dependencies
      # The Service-API client must import without `graphon`, which only the
      # `workflow` extra installs.
      run: |
        python -c "
        import dify_client
        missing = [n for n in dify_client.__all__ if not hasattr(dify_client, n)]
        assert not missing, missing
        print(f'imported {dify_client.__version__} with {len(dify_client.__all__)} names')
        "

    - name: Test import with the workflow extra
      run: |
        pip install "$(echo dist/*.whl)[workflow]"
        python -c "
        from dify_client.workflow import Workflow
        print('workflow extra ok')
        "

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, test-install]
    if: github.event_name == 'release' && github.event.action == 'published'

    # A named environment is where the approval lives: with "required
    # reviewers" set on it in the repository settings, a release cannot reach
    # PyPI until a human says so, and the run waits rather than uploading.
    environment:
      name: pypi
      url: https://pypi.org/p/dify-client

    permissions:
      # Trusted publishing: GitHub mints a short-lived OIDC token for this one
      # run, and PyPI checks it came from this repository, this workflow and
      # this environment. There is no long-lived API token to store, leak or
      # rotate — which is why `secrets.PYPI_API_TOKEN` is no longer read here.
      #
      # ONE-TIME SETUP on PyPI, under the project's Publishing settings:
      #   owner       langgenius
      #   repository  dify-python-sdk
      #   workflow    build.yml
      #   environment pypi
      # Until that exists, this job fails at the upload with "invalid-publisher"
      # and nothing is published.
      id-token: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1